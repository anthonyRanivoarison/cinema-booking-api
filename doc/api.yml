openapi: 3.0.3

info:
  title: CineBook API
  version: 1.0.0
  description: REST API for managing a cinema reservation system.

servers:
  - url: http://localhost:8080

tags:
  - name: Users
  - name: Movies
  - name: Projections
  - name: Rooms
  - name: Reservations

paths:
  /movies:
    get:
      tags:
        - Movies
      summary: Get all movies
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"

    post:
      tags:
        - Movies
      summary: Create a movie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovie"
      responses:
        "201":
          description: Movie created

  /movies/{id}:
    get:
      tags:
        - Movies
      summary: Get movie by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /projections:
    get:
      tags:
        - Projections
      summary: Get all projections
      responses:
        "200":
          description: List of projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Projection"

    post:
      tags:
        - Projections
      summary: Create projection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjection"
      responses:
        "201":
          description: Projection created

  /reservations:
    get:
      tags:
        - Reservations
      summary: Get all reservations
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

    post:
      tags:
        - Reservations
      summary: Create reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservation"
      responses:
        "201":
          description: Reservation created

  /rooms:
    get:
      tags:
        - Rooms
      summary: Get all rooms
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

components:
  schemas:

    Movie:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        gender:
          $ref: "#/components/schemas/MovieGender"
        description:
          type: string
        duration:
          type: string
          example: PT2H15M

    CreateMovie:
      type: object
      required:
        - title
        - gender
        - duration
      properties:
        title:
          type: string
        gender:
          $ref: "#/components/schemas/MovieGender"
        description:
          type: string
        duration:
          type: string
          example: PT2H15M

    Projection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        datetime:
          type: string
          format: date-time
        seatPrice:
          type: number
          format: double
        movieId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid

    CreateProjection:
      type: object
      required:
        - datetime
        - seatPrice
        - movieId
        - roomId
      properties:
        datetime:
          type: string
          format: date-time
        seatPrice:
          type: number
          format: double
        movieId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid

    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        projectionId:
          type: string
          format: uuid
        seatIds:
          type: array
          items:
            type: string
            format: uuid

    CreateReservation:
      type: object
      required:
        - userId
        - projectionId
        - seatIds
      properties:
        userId:
          type: string
          format: uuid
        projectionId:
          type: string
          format: uuid
        seatIds:
          type: array
          items:
            type: string
            format: uuid

    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        capacity:
          type: integer

    Seat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    MovieGender:
      type: string
      enum:
        - THRILLER
        - ROMANCE
        - COMEDY
        - DRAMA
        - ACTION
        - SCI_FI
        - FANTASY
        - ANIMATION

    UserRole:
      type: string
      enum:
        - CLIENT
        - EMPLOYEE
        - MANAGER
