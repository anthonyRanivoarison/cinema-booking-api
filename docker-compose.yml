services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinebook}
      POSTGRES_DB: ${POSTGRES_DB:-cinebook}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinebook} -d ${POSTGRES_DB:-cinebook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cinebook}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER:-cinebook}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-cinebook}}
      JWT_SECRET: ${JWT_SECRET:-gkW7GkG2R5jMBXeF30VCwuyug6tjCw2A0dUeTV3qCFE=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

volumes:
  db-data:
